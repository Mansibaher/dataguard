name: correctness
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env: {POSTGRES_USER: dataguard, POSTGRES_PASSWORD: dataguard, POSTGRES_DB: dataguard_test}
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U dataguard" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r backend/requirements-lock.txt
      - run: python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://dataguard:dataguard@localhost:5432/dataguard_test
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dataguard:dataguard@localhost:5432/dataguard_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: docker compose up -d --build
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run typecheck && npm test
        working-directory: frontend
      - run: docker compose logs
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/*.png
            frontend/test-results
      - run: docker compose down
        if: always()
